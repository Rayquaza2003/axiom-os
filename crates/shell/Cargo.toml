[package]
name = "axiom-shell"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
core-ai = { version = "0.1.0", path = "../core-ai" }
core-data = { version = "0.1.0", path = "../core-data" }
crossterm = "0.29.0"
ed25519-dalek = "3.0.0"
mesh = { version = "0.1.0", path = "../mesh" }
platform = { version = "0.1.0", path = "../platform" }
qrcode = { version = "0.14.1", default-features = false }
ratatui = "0.30.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
wasmi = { version = "2.0.0", features = ["portable-dispatch"] }

[dev-dependencies]
tempfile = "3.27.0"

[lib]
name = "axiom_shell"
path = "src/lib.rs"

[[bin]]
name = "axiom"
path = "src/main.rs"
